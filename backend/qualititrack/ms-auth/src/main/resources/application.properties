spring.application.name=ms-auth
server.port=8081

# PostgreSQL Neon Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false

# JWT (firma HMAC256; clave y emisor compartidos por los 3 servicios)
security.jwt.private.key=${JWT_SECRET}
security.jwt.user.generator=${JWT_ISSUER:qualitytrack}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Management
management.endpoints.web.exposure.include=health,info

# Paridad con develop (monolito): JSON en snake_case y sin open-in-view
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jpa.open-in-view=false
