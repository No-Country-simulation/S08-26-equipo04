spring.application.name=qualititrack


#Configuraciones de seguridad
spring.security.user.name=${SS_USER}
spring.security.user.password=${SS_PASSWORD}

#Configuraciones de BDD
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Configuraciones de JWT
security.jwt.private.key=${PRIVATE_KEY}
security.jwt.user.generator=${USER_GENERATOR}

# Comunicación con API usando snake case para preservar estándar de Java a la vez que se mantiene la consistencia con el front-end
spring.jackson.property-naming-strategy=SNAKE_CASE

# Configuración dinámica de port
server.port=${PORT:8080}

# Configuración del CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Estado de BD
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health

# Propiedades para la carga de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB