version: '3.8'

services:
  ms-auth:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    container_name: ms-auth
    env_file:
      - .env.docker.local
    ports:
      - "8081:8081"
    networks:
      - qualitytrack-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ms-business:
    build:
      context: .
      dockerfile: ms-business/Dockerfile
    container_name: ms-business
    env_file:
      - .env.docker.local
    ports:
      - "8082:8082"
    depends_on:
      ms-auth:
        condition: service_healthy
    networks:
      - qualitytrack-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ms-execution:
    build:
      context: .
      dockerfile: ms-execution/Dockerfile
    container_name: ms-execution
    env_file:
      - .env.docker.local
    ports:
      - "8084:8084"
    depends_on:
      ms-auth:
        condition: service_healthy
    networks:
      - qualitytrack-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - .env.docker.local
    ports:
      - "8080:8080"
    depends_on:
      ms-auth:
        condition: service_healthy
    environment:
      MS_AUTH_URL: http://ms-auth:8081
      MS_BUSINESS_URL: http://ms-business:8082
      MS_EXECUTION_URL: http://ms-execution:8084
    networks:
      - qualitytrack-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  qualitytrack-network:
    driver: bridge