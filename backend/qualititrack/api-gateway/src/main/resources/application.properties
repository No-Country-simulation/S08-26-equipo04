spring.application.name=apigateway
server.port=8080

# Desactivar completamente Eureka - no lo necesitamos para validar conectividad
eureka.client.enabled=false

# Gateway discovery manual por nombre de servicio (sin Eureka)
spring.cloud.gateway.discovery.locator.enabled=false

# Rutas hardcodeadas si es necesario, o dejamos que los clientes apunten directamente a los puertos
management.endpoints.web.exposure.include=health,info
spring.main.web-application-type=reactive