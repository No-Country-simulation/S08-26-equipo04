spring.application.name=apigateway
server.port=${PORT:8080}
spring.main.web-application-type=reactive

eureka.client.enabled=false
spring.autoconfigure.exclude=org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration

# Gateway Routes - con prefijos
spring.cloud.discovery.enabled=false
spring.cloud.config.discovery.enabled=false
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=${MS_AUTH_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**

spring.cloud.gateway.routes[1].id=business
spring.cloud.gateway.routes[1].uri=${MS_BUSINESS_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clientes/**,/api/fases/**,/api/cotizaciones/**,/api/solicitudes/**,/api/documentos/**

spring.cloud.gateway.routes[2].id=execution
spring.cloud.gateway.routes[2].uri=${MS_EXECUTION_URL:http://localhost:8084}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/ordenes-trabajo/**,/api/ot-fases/**,/api/calidad/**,/api/dashboard/**

# CORS - configurado en el gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

# Management
management.endpoints.web.exposure.include=health,info
